<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Market Data Globe</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <!-- Chargement automatique des dernieres donnees de scraping (exportees depuis Python) -->
    <script src="data/globe_data.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f5f7;
            color: #1e293b;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }
        #globe-container {
            width: 100vw;
            height: 100vh;
        }
        .header {
            position: absolute;
            top: 100px;
            left: 30px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 30px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { margin: 0 0 5px 0; font-size: 24px; color: #0f172a; }
        p { margin: 0; font-size: 14px; color: #aaa; }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #1e293b;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s;
            background: rgba(0,0,0,0.05);
        }
        .back-btn:hover {
            background: #0f172a;
            border-color: #0f172a;
            color: #ffffff;
        }
        #stats {
            margin-top: 8px;
            font-weight: 600;
            color: #1e293b;
            background: rgba(0,0,0,0.05);
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
        }
        .filters {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-btn {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            color: #1e293b;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
        }
        .filter-btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        .filter-btn.active {
            background: #0f172a;
            border-color: #0f172a;
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav id="navbar" class="scrolled">
        <div class="nav-content">
            <a href="index.html" class="logo">Moqua<span class="logo-author">by Mohammed Drici</span></a>
            <ul class="nav-links">
                <li><a href="pricer.html">Download Pricer</a></li>
                <li><a href="download.html">Python Package</a></li>
                <li><a href="white_paper.html">White Paper</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="header">
        <h1>Global Market Intelligence</h1>
        <p>Live data points extracted from APIs.</p>
        <div id="stats">Loading data...</div>
        
        <div class="filters">
            <button class="filter-btn active" onclick="filterData('accor', this)">Accor Hotels</button>
            <button class="filter-btn" onclick="filterData('brazil', this)">Brazil Supermarkets</button>
            <button class="filter-btn" onclick="filterData('all', this)">Show All</button>
        </div>

    </div>

    <div id="globe-container"></div>

    <script>
        // Verification du chargement des donnees depuis data/globe_data.js
        if (typeof globeData === 'undefined') {
            document.getElementById('globe-container').innerHTML = "<h2 style='text-align:center; padding: 50px; color: #ff3333;'>Error: data/globe_data.js not found. Please run the exporter script.</h2>";
            document.getElementById('stats').innerText = "Data unavailable";
        } else {
            // Afficher les statistiques
            const accorCount = globeData.accor.lat.length;
            const brazilCount = globeData.brazil.lat.length;
            document.getElementById('stats').innerText = `${accorCount} Hotels | ${brazilCount} Supermarkets`;

            // Configuration des traces (couches) Plotly
            const accorTrace = {
                type: 'scattergeo',
                mode: 'markers',
                lon: globeData.accor.lon,
                lat: globeData.accor.lat,
                text: globeData.accor.text,
                name: 'Accor Hotels',
                visible: true, // Affiché par défaut
                marker: {
                    size: 4,
                    color: '#0f172a',
                    line: { width: 0.5, color: '#fff' }
                }
            };

            const brazilTrace = {
                type: 'scattergeo',
                mode: 'markers',
                lon: globeData.brazil.lon,
                lat: globeData.brazil.lat,
                text: globeData.brazil.text,
                name: 'Brazil Supermarkets',
                visible: false, // Caché par défaut pour éviter le lag
                marker: {
                    size: 3,
                    color: '#00cc66',
                    line: { width: 0.5, color: '#fff' }
                }
            };

            const layout = {
                paper_bgcolor: '#f4f5f7',
                plot_bgcolor: '#f4f5f7',
                showlegend: false, // On désactive la légende native de Plotly pour utiliser nos boutons
                margin: { r: 0, t: 0, l: 0, b: 0 },
                geo: {
                    projection: { type: 'orthographic' },
                    showland: true,
                    landcolor: '#e2e8f0',
                    showocean: true,
                    oceancolor: '#f8fafc',
                    showcountries: true,
                    countrycolor: '#cbd5e1',
                    bgcolor: '#f4f5f7',
                    center: { lat: 20, lon: 0 } // Centré entre Europe et Amérique
                }
            };

            const config = { responsive: true, displayModeBar: false };

            Plotly.newPlot('globe-container', [accorTrace, brazilTrace], layout, config);

            // Fonction de filtrage appelée par les boutons
            window.filterData = function(type, btnElement) {
                // Mettre à jour l'état actif des boutons
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');

                // Index des traces : 0 = Accor, 1 = Brazil
                if (type === 'accor') {
                    Plotly.restyle('globe-container', 'visible', [true, false]);
                } else if (type === 'brazil') {
                    Plotly.restyle('globe-container', 'visible', [false, true]);
                } else if (type === 'all') {
                    Plotly.restyle('globe-container', 'visible', [true, true]);
                }
            };
        }
    </script>
</body>
</html>
