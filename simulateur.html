        // Core Mathematical function for Leg PnL
        function calcLegPnl(price, strike, premium, type, action, qty) {
            let pnl = 0;
            if (type === 'call') {
                pnl = Math.max(0, price - strike) - premium;
            } else if (type === 'put') {
                pnl = Math.max(0, strike - price) - premium;
            } else if (type === 'stock') {
                pnl = price - strike; 
            }
            
            if (action === 'sell') {
                pnl = -pnl;
            }
            return pnl * qty;
        }

        function updateUIForStrategy() {
            const strategyId = document.getElementById('strategy').value;
            const config = STRATEGIES[strategyId];
            
            document.getElementById('strategyDesc').innerText = config.desc;

            const groups = [
                { grp: document.getElementById('groupA'), leg: config.legs[0] },
                { grp: document.getElementById('groupB'), leg: config.legs[1] },
                { grp: document.getElementById('groupC'), leg: config.legs[2] }
            ];

            groups.forEach(item => {
                if (item.leg) {
                    item.grp.classList.remove('disabled-group');
                    item.grp.querySelector('.strike-label').innerText = item.leg.strikeLabel;
                    item.grp.querySelector('.action-text').innerText = item.leg.actionText;
                    
                    if (item.leg.type === 'stock') {
                        item.grp.querySelector('.premium-wrapper').style.display = 'none';
                    } else {
                        item.grp.querySelector('.premium-wrapper').style.display = 'block';
                        item.grp.querySelector('.premium-label').innerText = item.leg.premiumLabel;
                    }
                } else {
                    item.grp.classList.add('disabled-group');
                }
            });
        }

        function generateData() {
            updateUIForStrategy();

            const strategyId = document.getElementById('strategy').value;
            const config = STRATEGIES[strategyId];

            const A = parseFloat(document.getElementById('strikeA').value) || 0;
            const B = parseFloat(document.getElementById('strikeB').value) || 0;
            const C = parseFloat(document.getElementById('strikeC').value) || 0;

            const premiumA = parseFloat(document.getElementById('premiumA').value) || 0;
            const premiumB = parseFloat(document.getElementById('premiumB').value) || 0;
            const premiumC = parseFloat(document.getElementById('premiumC').value) || 0;

            document.getElementById('valA').innerText = A + " €";
            document.getElementById('valB').innerText = B + " €";
            document.getElementById('valC').innerText = C + " €";

            const xAxis = []; 
            const yAxisTotal = []; 
            
            const lowestStrike = Math.min(A, B, C);
            const highestStrike = Math.max(A, B, C);
            const startPrice = Math.max(0, lowestStrike - 30);
            const endPrice = highestStrike + 30;

            let componentsData = [];
            const colors = ['#27ae60', '#e74c3c', '#8e44ad'];
            let netCost = 0;
            let explanationHtml = `<ul>`;

            for(let i=0; i<config.legs.length; i++) {
                const leg = config.legs[i];
                const strike = i === 0 ? A : (i === 1 ? B : C);
                const premium = i === 0 ? premiumA : (i === 1 ? premiumB : premiumC);
                const compArray = [];
                
                for (let price = startPrice; price <= endPrice; price++) {
                    if (i === 0) xAxis.push(price); 
                    compArray.push(calcLegPnl(price, strike, premium, leg.type, leg.action, leg.qty));
                }
                
                let legCost = 0;
                if(leg.type !== 'stock') {
                   legCost = (leg.action === 'buy' ? 1 : -1) * premium * leg.qty;
                } else {
                   legCost = (leg.action === 'buy' ? 1 : -1) * strike * leg.qty;
                }
                netCost += legCost;
                
                let typeText = leg.type === 'stock' ? 'Shares' : (leg.type === 'call' ? 'Call(s)' : 'Put(s)');
                let actionText = leg.action === 'buy' ? 'Long' : 'Short';
                let costCreditStr = legCost > 0 ? `Cost: €${Math.abs(legCost).toFixed(2)}` : `Credit: €${Math.abs(legCost).toFixed(2)}`;
                if(legCost === 0 && leg.type !== 'stock') costCreditStr = "Free";

                let labelDesc = `${actionText} ${leg.qty} ${typeText} @ ${strike} (${costCreditStr})`;
                if (leg.type === 'stock') {
                    labelDesc = `${actionText} Stock @ €${strike}`;
                }
                
                componentsData.push({
                    label: labelDesc,
                    data: compArray,
                    borderColor: colors[i],
                    fill: false
                });

                explanationHtml += `<li><strong>${leg.strikeLabel}:</strong> ${actionText} ${leg.qty} ${typeText} at Strike ${strike}.</li>`;
            }

            explanationHtml += `</ul>`;
            
            for(let j=0; j<xAxis.length; j++) {
                let total = 0;
                for(let ds of componentsData) {
                    total += ds.data[j];
                }
                yAxisTotal.push(total);
            }

            let costLabel = netCost > 0 ? 'Net Cost (Debit)' : 'Net Credit';
            if (netCost === 0) costLabel = 'Net Cost';
            explanationHtml += `<div class="net-cost">${costLabel}: €${Math.abs(netCost).toFixed(2)}</div>`;

            document.getElementById('explanationText').innerHTML = explanationHtml;

            return { xAxis, yAxisTotal, componentsData };
        }

        function getCommonScales() {
            return {
                x: {
                    title: { display: true, text: 'Stock Price at Expiration (€)', font: {weight: 'bold'} }
                },
                y: {
                    title: { display: true, text: 'Profit / Loss (€)', font: {weight: 'bold'} },
                    grid: {
                        color: (context) => {
                            if (context.tick.value === 0) return 'rgba(231, 76, 60, 0.8)';
                            return 'rgba(0, 0, 0, 0.05)';
                        },
                        lineWidth: (context) => context.tick.value === 0 ? 2 : 1
                    }
                }
            };
        }

        function drawChart() {
            const data = generateData();

            if (totalChartInstance) {
                totalChartInstance.destroy();
            }
            totalChartInstance = new Chart(ctxTotal, {
                type: 'line',
                data: {
                    labels: data.xAxis,
                    datasets: [{
                        label: 'Total Strategy P&L (€)',
                        data: data.yAxisTotal,
                        borderColor: '#0f172a',
                        backgroundColor: 'rgba(15, 23, 42, 0.1)',
                        fill: true,
                        borderWidth: 3,
                        pointRadius: 0,
                        pointHoverRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    interaction: { intersect: false, mode: 'index' },
                    scales: getCommonScales()
                }
            });

            if (componentsChartInstance) {
                componentsChartInstance.destroy();
            }
            data.componentsData.forEach(ds => {
                ds.borderWidth = 2;
                ds.pointRadius = 0;
                ds.pointHoverRadius = 5;
                ds.borderDash = [5, 5];
            });

            componentsChartInstance = new Chart(ctxComponents, {
                type: 'line',
                data: {
                    labels: data.xAxis,
                    datasets: data.componentsData
                },
                options: {
                    responsive: true,
                    interaction: { intersect: false, mode: 'index' },
                    scales: getCommonScales(),
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        document.getElementById('strategy').addEventListener('change', function(e) {
            const strategy = e.target.value;
            
            if (['straddle', 'short_straddle', 'strip', 'strap'].includes(strategy)) {
                document.getElementById('strikeA').value = 100;
                document.getElementById('strikeB').value = 100;
                document.getElementById('premiumA').value = 4.0;
                document.getElementById('premiumB').value = 4.0;
            } else if (['strangle', 'short_strangle'].includes(strategy)) {
                document.getElementById('strikeA').value = 90;
                document.getElementById('strikeB').value = 110;
                document.getElementById('premiumA').value = 2.0;
                document.getElementById('premiumB').value = 2.0;
            } else if (['bull_call_spread', 'bear_put_spread'].includes(strategy)) {
                document.getElementById('strikeA').value = 95;
                document.getElementById('strikeB').value = 105;
                document.getElementById('premiumA').value = 5.0;
                document.getElementById('premiumB').value = 2.0;
            } else if (['bear_call_spread', 'bull_put_spread'].includes(strategy)) {
                document.getElementById('strikeA').value = 95;
                document.getElementById('strikeB').value = 105;
                document.getElementById('premiumA').value = 2.0;
                document.getElementById('premiumB').value = 5.0;
            } else if (strategy.includes('butterfly')) {
                document.getElementById('strikeA').value = 90;
                document.getElementById('strikeB').value = 100;
                document.getElementById('strikeC').value = 110;
                document.getElementById('premiumA').value = 5.0;
                document.getElementById('premiumB').value = 2.0;
                document.getElementById('premiumC').value = 0.5;
            } else if (strategy === 'bwb') {
                document.getElementById('strikeA').value = 90;
                document.getElementById('strikeB').value = 100;
                document.getElementById('strikeC').value = 115;
                document.getElementById('premiumA').value = 5.0;
                document.getElementById('premiumB').value = 2.0;
                document.getElementById('premiumC').value = 0.1;
            } else if (strategy === 'covered_call') {
                document.getElementById('strikeA').value = 95;
                document.getElementById('strikeB').value = 105;
                document.getElementById('premiumB').value = 3.0;
            }
            
            drawChart();
        });

        document.getElementById('strikeA').addEventListener('input', drawChart);
        document.getElementById('strikeB').addEventListener('input', drawChart);
        document.getElementById('strikeC').addEventListener('input', drawChart);
        document.getElementById('premiumA').addEventListener('input', drawChart);
        document.getElementById('premiumB').addEventListener('input', drawChart);
        document.getElementById('premiumC').addEventListener('input', drawChart);

        drawChart();
    </script>
</body>
</html>
